name: Accounting & Finance Job Radar

on:
  workflow_dispatch:
  schedule:
    # Every hour at minute 17 UTC (not at the top of the hour).
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/radar.yml'

concurrency:
  group: job-radar-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test scanner and matching rules
        run: python -m unittest discover -s tests -v
      - name: Scan public career APIs
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/scanner.py
      - name: Persist public job cache and scanner state
        run: |
          git config user.name 'job-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update job radar data [skip ci]'
            git push
          fi
      - name: Send new matching job emails
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python scripts/send_email.py
      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  publish:
    runs-on: ubuntu-latest
    needs: monitor
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy latest dashboard
        id: deployment
        uses: actions/deploy-pages@v4
